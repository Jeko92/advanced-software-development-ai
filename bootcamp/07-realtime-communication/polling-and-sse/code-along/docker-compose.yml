name: polling-and-sse-code-along

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${POSTGRES_HOST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - polling-sse-pgdata:/var/lib/postgresql

  api:
    build:
      context: ../../../..
      dockerfile: bootcamp/07-realtime-communication/polling-and-sse/code-along/api/Dockerfile
    ports:
      - '3030:3030'
    environment:
      PORT: 3030
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - ./api:/app/bootcamp/07-realtime-communication/polling-and-sse/code-along/api
      - /app/bootcamp/07-realtime-communication/polling-and-sse/code-along/api/node_modules
      - /app/bootcamp/07-realtime-communication/polling-and-sse/code-along/api/dist
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3030/health']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../../../..
      dockerfile: bootcamp/07-realtime-communication/polling-and-sse/code-along/web/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - ./web:/app/bootcamp/07-realtime-communication/polling-and-sse/code-along/web
      - /app/bootcamp/07-realtime-communication/polling-and-sse/code-along/web/node_modules
      - /app/bootcamp/07-realtime-communication/polling-and-sse/code-along/web/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  polling-sse-pgdata:

services:
  scoreboard:
    build:
      target: builder
    working_dir: /repo/bootcamp/05-devops/docker-advanced/scoreboard-service
    command: node_modules/.bin/tsx watch src/index.ts
    environment:
      # Docker Desktop's macOS bind-mount file sharing doesn't always
      # forward native filesystem change events into the container, so
      # the watcher can miss edits. Polling trades a bit of CPU for
      # reliably catching every change instead.
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    volumes:
      - ./:/repo/bootcamp/05-devops/docker-advanced/scoreboard-service
      - /repo/bootcamp/05-devops/docker-advanced/scoreboard-service/node_modules

  db:
    volumes:
      - postgres_dev_data:/var/lib/postgresql

volumes:
  postgres_dev_data:

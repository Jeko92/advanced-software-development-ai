name: DevOps CI/CD Code-Along - CI

on:
  push:
    paths:
      - 'bootcamp/05-devops/ci-cd/code-along/**'
      - '.github/workflows/devops-ci-cd-code-along-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bootcamp/05-devops/ci-cd/code-along/**'
      - '.github/workflows/devops-ci-cd-code-along-ci.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [lint, test, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task }}
        run: pnpm exec turbo run ${{ matrix.task }} --filter=@bootcamp/devops-ci-cd-code-along

name: DevOps CI/CD Code-Along - CI

on:
  push:
    paths:
      - 'bootcamp/05-devops/ci-cd/code-along/**'
      - '.github/workflows/devops-ci-cd-code-along-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bootcamp/05-devops/ci-cd/code-along/**'
      - '.github/workflows/devops-ci-cd-code-along-ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec turbo run lint --filter=@bootcamp/devops-ci-cd-code-along

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm exec turbo run test --filter=@bootcamp/devops-ci-cd-code-along

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec turbo run build --filter=@bootcamp/devops-ci-cd-code-along

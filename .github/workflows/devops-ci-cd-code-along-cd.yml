name: DevOps CI/CD Code-Along - CD

on:
  push:
    branches: [main]
    paths:
      - 'bootcamp/05-devops/ci-cd/code-along/**'
      - '.github/workflows/devops-ci-cd-code-along-cd.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bootcamp/05-devops/ci-cd/code-along/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-ci-cd-code-along:latest

      - name: Trigger Render redeploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
